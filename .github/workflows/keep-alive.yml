name: Keep Supabase Alive

on:
  schedule:
    # Runs at 00:00 every day
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual triggering from GitHub UI

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Health Check / Ping Database
        run: |
          echo "Pinging Supabase to prevent inactivity pause..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/works?select=id&limit=1")
          
          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "✅ Successfully pinged Supabase (Status: $HTTP_STATUS)"
          else
            echo "❌ Failed to ping Supabase (Status: $HTTP_STATUS)"
            exit 1
          fi
