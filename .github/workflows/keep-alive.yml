name: Keep Supabase Alive

on:
  schedule:
    # Runs at 00:00 every day
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual triggering from GitHub UI

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Health Check / Ping Database
        run: |
          echo "Pinging Works page to prevent inactivity pause..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://saleeldesigns.com/works")
          
          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "✅ Successfully pinged Works page (Status: $HTTP_STATUS)"
          else
            echo "❌ Failed to ping Works page (Status: $HTTP_STATUS)"
            exit 1
          fi
